name: bizforce-crm

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bizforce}
      POSTGRES_USER: ${POSTGRES_USER:-bizforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bizforce}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-bizforce}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?Set PORTAL_JWT_SECRET in .env}
      CORS_ORIGIN: ${APP_ORIGIN:-https://bizforce-crm.online}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - backend_uploads:/app/packages/backend/uploads
      - backend_private:/app/packages/backend/private
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      dockerfile: packages/frontend-next/Dockerfile
      args:
        BACKEND_ORIGIN: http://backend:3000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/opencode/crm/certs:/etc/letsencrypt:ro
      - /tmp/opencode/crm/certbot-www:/var/www/certbot:ro
    networks:
      - backend
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot
    volumes:
      - /tmp/opencode/crm/certs:/etc/letsencrypt
      - /tmp/opencode/crm/certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  backend:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  backend_uploads:
  backend_private:
